name: Atualizar cartões do README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cartão de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&count_private=true&locale=pt-br&hide_border=true&border_radius=8&bg_color=102A36&title_color=E39463&icon_color=C96B38&text_color=FAF7F2
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cartão de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&locale=pt-br&hide_border=true&border_radius=8&bg_color=102A36&title_color=E39463&text_color=FAF7F2
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dos cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cartões do README" || exit 0
          git push
